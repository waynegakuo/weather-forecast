<section
  class="hero-banner relative flex h-full flex-1 flex-col justify-between overflow-hidden rounded-[1.35rem] border border-white/[0.08] p-5 sm:p-7"
  animate.enter="animate-scale-in"
>
  <!-- Dramatic Atmospheric Sky Photograph -->
  <div
    class="hero-banner__photo absolute inset-0 bg-cover bg-center transition-all duration-1000"
    [style.background-image]="'url(' + heroPhoto() + ')'"
    aria-hidden="true"
  ></div>

  <!-- Smooth Charcoal Vignette Overlay for High-Contrast Legibility -->
  <div class="hero-banner__scrim absolute inset-0" aria-hidden="true"></div>

  <!-- Main Content Grid inside Hero Banner -->
  <div class="relative z-10 flex flex-1 flex-col justify-between gap-4 sm:flex-row sm:items-end">
    <!-- Left Side: Giant Thin Temperature, Headline, Subtitle, H/L Rounded Tags -->
    <div class="flex h-full flex-col justify-between">
      <div class="flex items-start">
        <span class="text-6xl sm:text-[5rem] font-light leading-none tracking-tight text-white">
          {{ currentTemp() }}°
        </span>
      </div>

      <div class="mt-3">
        <h2 class="text-2xl sm:text-[1.7rem] font-medium leading-tight tracking-tight text-white">
          {{ presentation().headline }}
        </h2>
        <p class="mt-0.5 text-sm sm:text-base font-normal text-white/60">
          {{ presentation().subtitle }}
        </p>

        <div class="mt-3 flex items-center gap-2">
          <div class="inline-flex items-center gap-2 rounded-xl border border-white/[0.08] bg-white/[0.12] px-3 py-1 text-xs backdrop-blur-md">
            <span class="text-white/60">H</span>
            <span class="font-medium text-white">{{ todayHigh() }}°</span>
          </div>
          <div class="inline-flex items-center gap-2 rounded-xl border border-white/[0.08] bg-white/[0.12] px-3 py-1 text-xs backdrop-blur-md">
            <span class="text-white/60">L</span>
            <span class="font-medium text-white">{{ todayLow() }}°</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Right Side: Frosted Glass Forecast Summary Box -->
    <div
      class="w-full sm:max-w-[230px] rounded-2xl border border-white/[0.1] bg-[#1a1b1e]/60 p-3.5 text-xs leading-relaxed text-white/85 backdrop-blur-xl shadow-lg"
    >
      <p>{{ narrative() }}</p>
    </div>
  </div>
</section>
