<div class="flex h-full min-h-0 flex-col justify-between" animate.enter="animate-fade-up">
  <app-highlights-grid
    [current]="weather().current"
    [hourly]="weather().hourly"
    [unit]="unit()"
    [recentCities]="recentCities()"
    [showExtendedMetrics]="showExtendedMetrics()"
    (selectCity)="selectCity.emit($event)"
  />
</div>
