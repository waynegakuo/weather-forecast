<p
  [class]="selected() ? 'text-xs sm:text-sm font-medium tracking-normal text-white' : 'text-xs sm:text-sm tracking-normal text-white/75'"
>
  {{ day().date | date: 'EEE' }}
</p>

<div class="my-1.5 flex flex-col items-center justify-center">
  <app-weather-icon [code]="day().weatherCode" [isDay]="true" [size]="40" />
  @if (day().precipitationProbabilityMax >= 20) {
    <span class="mt-0.5 text-[10px] font-medium text-sky-400">
      {{ day().precipitationProbabilityMax }}%
    </span>
  }
</div>

<div class="flex flex-col items-center leading-snug">
  <span class="text-base sm:text-lg font-medium text-white">{{ tempMax() }}°</span>
  <span class="text-xs sm:text-sm text-white/45">{{ tempMin() }}°</span>
</div>
