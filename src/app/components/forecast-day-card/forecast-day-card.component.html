<div class="flex flex-col items-center">
  <p class="font-mono text-[11px] font-semibold uppercase tracking-[0.14em]" [class.text-amber-300]="index() === 0" [class.text-slate-200]="index() !== 0">
    {{ index() === 0 ? 'Today' : (day().date | date: 'EEE') }}
  </p>
  <p class="mt-0.5 font-mono text-[10px] text-slate-400">{{ day().date | date: 'MMM d' }}</p>

  <div class="my-2.5">
    <app-weather-icon [code]="day().weatherCode" [isDay]="true" [size]="40" />
  </div>

  <p class="line-clamp-1 text-[11px] font-medium text-slate-300">{{ day().description }}</p>

  <div class="mt-2.5 flex items-baseline justify-center gap-2 font-mono text-sm">
    <span class="font-bold text-white">{{ tempMax() }}°</span>
    <span class="text-xs text-slate-400">{{ tempMin() }}°</span>
  </div>

  @if (day().precipitationProbabilityMax >= 10) {
    <div class="mt-2 inline-flex items-center gap-1 rounded-full bg-sky-500/15 px-2 py-0.5 font-mono text-[10px] font-medium text-sky-300">
      <svg class="h-2.5 w-2.5 fill-sky-400" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M8 1.5C8 1.5 3 6.9 3 10.2C3 12.9 5.2 15 8 15C10.8 15 13 12.9 13 10.2C13 6.9 8 1.5 8 1.5Z" />
      </svg>
      {{ day().precipitationProbabilityMax }}%
    </div>
  }
</div>
