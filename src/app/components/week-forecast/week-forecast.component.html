<section aria-labelledby="week-heading">
  <h2 id="week-heading" class="font-display text-lg font-bold text-white">7-day outlook</h2>
  <div class="mt-4 flex gap-3 overflow-x-auto pb-2 snap-x snap-mandatory">
    @for (day of daily(); track day.date; let i = $index) {
      <app-forecast-day-card
        [day]="day"
        [index]="i"
        class="min-w-[7.5rem] shrink-0 snap-start"
      />
    }
  </div>
</section>
