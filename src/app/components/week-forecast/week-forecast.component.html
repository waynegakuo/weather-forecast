<section aria-label="7-day forecast">
  <div class="grid grid-cols-4 gap-2.5 sm:grid-cols-7">
    @for (day of daily(); track day.date; let i = $index) {
      <app-forecast-day-card
        [day]="day"
        [index]="i"
        [unit]="unit()"
        [selected]="selectedIndex() === i"
        (click)="selectedIndex.set(i)"
      />
    }
  </div>
</section>
